name: PIP packages
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write  # Trusted Publishing + PEP 740 attestations via GitHub OIDC
jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        pyver: [cp314-cp314, cp312-cp312]
    steps:
    - uses: actions/checkout@v6
    - name: Docker Image
      run: docker build SDK -t pypi
    - name: Build
      run: |
        docker run -e PYVER=${{ matrix.pyver }} -e SKBUILD_BUILD_OPTIONS=-j4 --rm -v `pwd`:/workspace pypi
        f=`ls *.whl`
        mv $f ${f/linux/manylinux_2_28}
        pip3 install twine pypi-attestations
        pypi-attestations sign *.whl
        python -m twine upload --attestations --repository pypi *.whl *.attestation
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        pyver: ['3.14', '3.12']
    env:
      # TODO: Remove once ilammy/msvc-dev-cmd is updated to support Node.js 24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - uses: actions/checkout@v6
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 14.2
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pyver }}
    # see https://github.com/actions/runner-images/issues/6627#issuecomment-1328214957
    - name: Remove Perl Strawberry (Workaround)
      run: rm -rf C:/Strawberry/
      shell: bash
    - name: Install Dependencies
      run: |
        curl -LO https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe
        .\VulkanSDK-1.3.296.0-Installer.exe --accept-licenses --default-answer --confirm-command install
    - name: Build
      run: |
        python -m pip install --upgrade pip==24.0
        pip install setuptools wheel twine pypi-attestations
        pip wheel . --verbose
        pypi-attestations sign *.whl
        python -m twine upload --attestations --repository pypi *.whl *.attestation
      env:
        VULKAN_SDK: C:\VulkanSDK\1.3.296.0
        SKBUILD_BUILD_OPTIONS: -j4
  macos:
    runs-on: macos-14
    strategy:
      matrix:
        pyver: ['3.14', '3.12']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pyver }}
    - name: Build
      run: |
        pip install setuptools wheel twine pypi-attestations
        pip wheel . --verbose
        pypi-attestations sign *.whl
        python -m twine upload --attestations --repository pypi *.whl *.attestation
      env:
        SKBUILD_BUILD_OPTIONS: -j3
